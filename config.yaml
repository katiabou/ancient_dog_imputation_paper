# chr number
chromosome_number: '38'

#specify output folder/path
path: '/projects/racimolab/people/qcj125/IMPUTATION_ROH_paper_v4'

#path to reference panel
#reference_panel: '/projects/racimolab/people/qcj125/MUNICH_FILES/REFERENCE_MUNICH/1715g_WildSled.SNP.INDEL.chrAll.vcf.gz'
reference_panel: '/projects/racimolab/people/qcj125/MUNICH_FILES/REFERENCE_MUNICH/PUBLISHABLE_VERSION/1701g_WildSled.SNP.INDEL.chrAll.vcf.gz'

#reference fasta file
#ref_fasta_file: '/projects/racimolab/people/qcj125/MUNICH_FILES/IMPUTATION_2023/reference_genome/canFam3_withY.fa'
ref_fasta_file: '/projects/racimolab/people/qcj125/MUNICH_FILES/canFam3_withY.fa'

#list of validation samples with their VCF name in the reference panel 
ref_validation_list: 'sample_lists/target_names_reference_remove_published.tsv'

#genetic maps for concordance ### should check that this is actually accurate
gen_map_path: '/maps/projects/racimolab/people/qcj125/Siberian_dogs/Reference/dog_recombination/GLIMPSE_formated_gen_maps/'
gen_map_files: '{chrom}_average_canFam3.1_modified.tsv'

#genetic maps for full imputation
gen_map_files_impute: '{chrom}_average_canFam3.1_modified.tsv'

#depth cutoff for individuals in reference panel
depth_cutoff: '8'

#F_missing cutoff to filter sites from reference panel
F_MISSING: '0.05'

#Bam files for concordance
bam_targets: 'sample_lists/concordance_bams_published.tsv'

#Bam files to impute 
bam_imputation: 'sample_lists/bams_published_imputation_metadata_cutoff.tsv'
bam_imputation_meta: 'sample_lists/Dog_Wolf_aDNA_WG-Master.tsv'

#Paths to GLIMPSE modules
glimpse_chunk: '/maps/projects/racimolab/people/qcj125/programmes/GLIMPSE/chunk/bin/GLIMPSE_chunk'
glimpse_impute: '/maps/projects/racimolab/people/qcj125/programmes/GLIMPSE/phase/bin/GLIMPSE_phase'
glimpse_ligate: '/maps/projects/racimolab/people/qcj125/programmes/GLIMPSE/ligate/bin/GLIMPSE_ligate'
glimpse_sample: '/maps/projects/racimolab/people/qcj125/programmes/GLIMPSE/sample/bin/GLIMPSE_sample'
glimpse_concordance: '/maps/projects/racimolab/people/qcj125/programmes/GLIMPSE/concordance/bin/GLIMPSE_concordance'

#GLIMPSE_chunk parameters
window_size: '2000000'
buffer_size: '200000'


##### PARAMETERS TO BE CHOSEN AFTER IMPUTATION ACCURACY ASSESSMENT #####
maf_cutoff: '0.01'
info_cutoff: '0.8' 

#ROH plink parameters:
roh:
  homozyg_density: '50' 
  homozyg_gap: '500'
  homozyg_kb: '500' 
  homozyg_snp: '50' 
  homozyg_window_het: '1'
  homozyg_window_missing: '5' 
  homozyg_window_snp: '50' 
  homozyg_window_threshold: '0.05'


##### FILES USED FOR PCA #####
modern_canid_subset: 'sample_lists/ref_panel_filt_{canid_subset}.tsv'
imputed_canid_subset: 'sample_lists/names_imputed_{canid_subset}.tsv'

#Reference panel metadata
reference_panel_metadata: 'sample_lists/Dog_Wolf_aDNA_WG-Modern.tsv'

#Canfam3.1 annotation file
canfam31_annotation: 'data/annotation_file/Canis_lupus_familiaris.CanFam3.1.104.gtf'


#ROHan results from Sabhrina (have to adjust if I use min, mid, max):

#rohan with 1 Mbp window size:
rohan: '/projects/racimolab/people/qcj125/IMPUTATION_ROH_paper_v2/GLIMPSE/GITHUB_SCRIPTS/DOG_IMPUTATION_PAPER/data/ROHan/ROHan_4e-5_KatiaPipeline.tsv'


